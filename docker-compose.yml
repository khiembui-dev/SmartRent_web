# Database cho team backend. Mỗi máy chạy một bản riêng, cùng cấu trúc và danh mục ban đầu; không tự nạp demo.
# Lần đầu: copy .env.example .env   rồi   docker compose up -d
# Xem hướng dẫn ở database/README.md. Baseline hiện tại gồm 13 bảng.
name: smartrent

services:
  db:
    image: postgres:16.13
    container_name: smartrent-db
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh", "-c", "log_timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_DB: smartrent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Chưa có file .env, hãy sao chép từ .env.example}
      SMARTRENT_APP_PASSWORD: ${DB_APP_PASSWORD:?Chưa có file .env, hãy sao chép từ .env.example}
    ports:
      # Mặc định 5433 để không đụng PostgreSQL đã cài trên máy ở cổng 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - smartrent-compact-db-data:/var/lib/postgresql/data
      - ./database:/smartrent-database:ro
      - ./database/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Chỉ đạt khi init.sql đã chạy tới cuối. Nếu nạp lỗi giữa chừng, container khởi động lại sẽ không nạp lần nữa,
      # nên không được coi là sẵn sàng chỉ vì máy chủ đã bật. Gọi qua TCP vì lúc đang nạp máy chủ chưa mở cổng này.
      test:
        - CMD-SHELL
        - psql -h 127.0.0.1 -U postgres -d smartrent -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'smartrent_app'" | grep -q 1
      interval: 5s
      timeout: 3s
      retries: 12
      # Lần đầu phải nạp toàn bộ script nên máy chậm cũng không bị báo lỗi sớm.
      start_period: 180s

volumes:
  smartrent-compact-db-data:
