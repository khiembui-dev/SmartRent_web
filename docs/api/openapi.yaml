            passwordChanged:
              type: boolean
            name:
              type: string
            permissions:
              type: array
              items:
                type: string
            code:
              type: string
            status:
              type: string
            roleIds:
              type: array
              items:
                type: string
                format: uuid
            propertyScope:
              type: string
              enum:
                - all
                - assigned
            propertyIds:
              type: array
              items: {}
            email:
