                - visibility
                - purpose
              properties:
                file:
                  type: string
                  format: binary
                visibility:
                  type: string
                  enum:
                    - private
                    - public
                purpose:
                  type: string
                  enum:
                    - identity_front
                    - identity_back
                    - contract_signed
                    - payment_proof
                    - handover
                    - ticket
                    - room_image
                    - expense
