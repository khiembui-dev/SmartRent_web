# SmartRent – hợp đồng API ĐỀ XUẤT (chưa được backend triển khai).
# Sinh lần đầu từ mock của frontend; từ nay chỉnh trực tiếp tệp này và giữ mock khớp (npm run check:contract trong frontend/).
openapi: "3.1.0"
info:
  title: SmartRent API (đề xuất)
  license:
    name: Tài liệu nội bộ dự án SmartRent
  version: 0.1.0-draft
  description: |-
    TRẠNG THÁI: ĐỀ XUẤT, CHƯA ĐƯỢC BACKEND TRIỂN KHAI. Hợp đồng này mô tả API mà frontend SmartRent đang gọi (chế độ mock dùng đúng các đường dẫn và DTO này).
    Đường dẫn, tên trường và mã lỗi là đề xuất để team backend (ASP.NET Core Web API + EF Core + Npgsql + PostgreSQL) xem xét và chốt; khi đổi cần cập nhật frontend/src/services/api.js và mock tương ứng.

    Quy ước:
    - JSON camelCase. Ngày nghiệp vụ: chuỗi YYYY-MM-DD (DateOnly), không kèm giờ/múi giờ. Thời điểm: ISO 8601 UTC có Z (timestamptz). Hiển thị theo Asia/Ho_Chi_Minh ở client.
    - Khoảng ngày nửa mở [from, to): ngày bắt đầu tính, ngày kết thúc không tính (endsOn, serviceTo). Hiển thị ngày cuối = endsOn − 1.
    - Tiền VND: số nguyên JSON (numeric(18,0)), không dùng số thực. Đơn giá tối đa 4 chữ số thập phân, chỉ số công tơ 3, số lượng dòng 6. Làm tròn từng dòng half away from zero.
    - Số liệu dẫn xuất (đã thu, còn nợ, cọc đang giữ, chưa phân bổ, tình trạng ở) tính từ view, không lưu cột.
    - Danh sách: page (từ 1), pageSize (≤200), sort (tên trường, tiền tố "-" để giảm dần, nhiều trường cách nhau dấu phẩy), q (tìm không phân biệt dấu). Bộ lọc, tìm kiếm, sắp xếp trên toàn bộ tập ở máy chủ. Frontend chuyển tham số DataTables (start/length/order/search) sang các tham số này; backend không cần hiểu tham số DataTables.
    - Lỗi: application/problem+json (RFC 9457) với code và errors theo trường. 401 chưa đăng nhập/hết hạn (client thử refresh một lần), 403 thiếu quyền, 404 không tồn tại HOẶC ngoài phạm vi (không lộ sự tồn tại), 409 xung đột trạng thái/trùng/chồng lịch, 422 dữ liệu hoặc quy tắc nghiệp vụ.
    - Thao tác tiền/chứng từ nhận header Idempotency-Key (UUID do client tạo, giữ nguyên khi thử lại). Cùng khóa + cùng nội dung → trả lại kết quả cũ; cùng khóa + nội dung khác → 422 idempotency_key_reused. Client không tự thử lại thao tác ghi khi không có khóa.
    - Chỉ hai role tài khoản admin/user. Một admin/chủ trọ toàn quyền; gửi X-Organization-Id để chọn cơ sở đang quản lý. Khách chỉ truy cập dữ liệu gắn với tenants.user_id. Không có API tạo vai trò, phân quyền hay quản trị hệ thống.
    - Mỗi giao dịch nghiệp vụ đặt smartrent.actor_id, smartrent.reason, smartrent.correlation_id (set_config(..., true)) để trigger audit ghi nhật ký.
    - Schema response được suy ra từ response thật của mock (dữ liệu seed v9-admin-user-single-business); kịch bản npm run test:mock gọi thành công đủ 216 thao tác. Ví dụ request lấy từ kịch bản đó.
servers:
  - url: /
    description: Cùng origin với frontend (reverse proxy /api) hoặc origin đặt trong VITE_API_BASE_URL. Backend chưa được triển khai.
tags:
  - name: Xác thực
    description: Đăng nhập, phiên, quên/đặt lại mật khẩu, thông tin người dùng hiện tại.
  - name: Công khai
    description: Tin đăng phòng, bộ lọc, gửi yêu cầu thuê/liên hệ. Không cần đăng nhập; chỉ trả dữ liệu công khai.
  - name: Cơ sở và phòng
    description: Cơ sở, phòng, trạng thái vận hành, tin đăng, ảnh, tài sản, bảng giá, danh mục.
  - name: Yêu cầu thuê, lịch xem, giữ chỗ
    description: Tiếp nhận yêu cầu, hẹn xem, giữ chỗ có hạn. Giữ chỗ chiếm lịch phòng nhưng chưa phải nhận phòng.
  - name: Khách thuê
    description: Hồ sơ khách, giấy tờ, mời vào cổng, duyệt đề nghị sửa hồ sơ.
  - name: Tiền cọc
    description: "Sổ cọc theo đợt thuê: nhận, hoàn, bù trừ, chuyển. Cọc yêu cầu (hợp đồng) khác cọc đã thu (sổ cọc)."
  - name: Đợt thuê
    description: Nhận phòng, người ở cùng, chuyển phòng, trả phòng và quyết toán, đề nghị từ khách, bàn giao.
  - name: Hợp đồng
    description: Hợp đồng và phiên bản; phiên bản đã ký bất biến; chấm dứt/lưu trữ/kế tiếp.
  - name: Công tơ và kỳ tính tiền
    description: Kỳ tính tiền, bảng việc kỳ, khóa/mở kỳ, công tơ, chỉ số, thay công tơ.
  - name: Hóa đơn
    description: Nháp, tính lại, phát hành (đơn lẻ/hàng loạt), hủy, điều chỉnh, thay thế, gửi (mô phỏng).
  - name: Thu tiền
    description: Phiếu thu, xác nhận/từ chối, phân bổ, đảo phân bổ, đảo tiền.
  - name: Công nợ và báo cáo
    description: Công nợ theo khách/tuổi nợ, dashboard, báo cáo, xuất dữ liệu.
  - name: Ticket
    description: Sự cố, hội thoại, ghi chú nội bộ, phân công, SLA, chuyển trạng thái.
  - name: Thông báo
    description: Thông báo trong ứng dụng của người dùng hiện tại.
  - name: Cấu hình và tác vụ nền
    description: Cấu hình đơn vị, SMTP (mật khẩu chỉ ghi), mẫu, lịch nhắc, tác vụ nền, lịch sử gửi, tích hợp.
  - name: Nhật ký
    description: Nhật ký thao tác chỉ đọc.
  - name: Chi phí (mở rộng)
    description: Sổ chi phí vận hành; sửa sai bằng bút toán đảo.
  - name: Trợ lý AI (tùy chọn)
    description: Hỏi đáp chỉ đọc trong phạm vi quyền. Chưa kết nối mô hình thật.
  - name: Tệp
    description: Tải lên (multipart) và lấy đường dẫn tải có thời hạn; backend kiểm tra quyền theo chứng từ gắn tệp.
  - name: Cổng khách thuê
    description: Chỉ dữ liệu của chính khách; người ở cùng không xem công nợ của người đại diện.
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Xác thực
      summary: Đăng nhập
      description: Đăng nhập bằng email + mật khẩu (ASP.NET Core Identity). Trả access token ngắn hạn; refresh token nên đặt trong cookie HttpOnly, Secure, SameSite=Lax/Strict. Khóa tạm sau nhiều lần sai.
      operationId: postAuthLogin
      x-actor: Khách vãng lai (không đăng nhập)
      x-error-codes:
        - invalid_credentials
        - account_locked
        - admin_only
        - customer_only
        - invalid_audience
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            example:
              email: ha.chutro@example.com
              password: demo1234
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/register:
    post:
      tags:
        - Xác thực
      summary: Khách tự tạo tài khoản
      description: Tạo tài khoản và hồ sơ khách (mục Khách thuê của admin, trạng thái Chưa thuê), trả phiên đăng nhập. Không tự nối vào hồ sơ có sẵn trùng email hoặc điện thoại khi chưa xác minh.
      operationId: postAuthRegister
      x-actor: Khách vãng lai (không đăng nhập)
      x-error-codes:
        - validation_failed
        - email_taken
        - registration_closed
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
            example:
              fullName: Lê Hoàng Long
              phone: "0912345678"
              email: long.khachmoi@example.com
              password: matkhau123
              acceptedTerms: true
      responses:
        "200":
          description: Thành công, trả phiên đăng nhập.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/logout:
    post:
      tags:
        - Xác thực
      summary: Đăng xuất
      operationId: postAuthLogout
      x-actor: Người dùng đã đăng nhập
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Thành công, không có nội dung.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/refresh:
    post:
      tags:
        - Xác thực
      summary: Làm mới access token bằng refresh cookie
      operationId: postAuthRefresh
      x-actor: Người dùng đã đăng nhập
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Xác thực
      summary: Yêu cầu đặt lại mật khẩu
      description: Luôn trả 200 với thông điệp chung để không lộ email có tồn tại hay không. Gửi email đặt lại có thời hạn.
      operationId: postAuthForgotPassword
      x-actor: Khách vãng lai (không đăng nhập)
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordRequest"
            example:
              email: bich.oghep@example.com
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AuthForgotPasswordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/reset-password:
    post:
      tags:
        - Xác thực
      summary: Đặt lại mật khẩu bằng token
      operationId: postAuthResetPassword
      x-actor: Khách vãng lai (không đăng nhập)
      x-error-codes:
        - invalid_reset_token
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AuthResetPasswordRequest"
            example:
              token: demo-reset-token
              newPassword: demo1234
      responses:
        "204":
          description: Thành công, không có nội dung.
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/me:
    get:
      tags:
        - Xác thực
      summary: Danh sách me
      description: "Ngữ cảnh người dùng: các đơn vị đang là thành viên (vai trò, quyền, phạm vi cơ sở), hồ sơ khách thuê (vai trò đại diện/người ở cùng), cờ quản trị hệ thống. Giao diện chỉ dùng để ẩn/hiện; máy chủ kiểm tra quyền ở mọi API."
      operationId: getMe
      x-actor: Người dùng đã đăng nhập
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me/profile:
    put:
      tags:
        - Xác thực
      summary: Cập nhật thông tin tài khoản đang đăng nhập
      description: Họ tên, email đăng nhập, số điện thoại liên hệ và ảnh đại diện. Gửi avatarFileId = null để xóa ảnh; bỏ trường này để giữ nguyên.
      operationId: putMeProfile
      x-actor: Người dùng đã đăng nhập
      x-error-codes:
        - email_taken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - displayName
                - email
              properties:
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type:
                    - string
                    - "null"
                avatarFileId:
                  type:
                    - string
                    - "null"
                  format: uuid
      responses:
        "200":
          description: Ngữ cảnh người dùng sau khi cập nhật (cùng dạng GET /api/v1/me).
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/me/change-password:
    post:
      tags:
        - Xác thực
      summary: Đổi mật khẩu
      operationId: postMeChangePassword
      x-actor: Người dùng đã đăng nhập
      x-error-codes:
        - validation_failed
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MeChangePasswordRequest"
            example:
              currentPassword: demo1234
              newPassword: demo12345
      responses:
        "204":
          description: Thành công, không có nội dung.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/me/sessions:
    get:
      tags:
        - Xác thực
      summary: Danh sách phiên đăng nhập
      operationId: getMeSessions
      x-actor: Người dùng đã đăng nhập
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách (không phân trang, tập nhỏ).
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me/sessions/{id}:
    delete:
      tags:
        - Xác thực
      summary: Xóa phiên đăng nhập
      operationId: deleteMeSessionsById
      x-actor: Người dùng đã đăng nhập
      x-error-codes:
        - not_found
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Thành công, không có nội dung.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/public/filters:
    get:
      tags:
        - Công khai
      summary: Bộ lọc
      operationId: getPublicFilters
      x-actor: Khách vãng lai (không đăng nhập)
      security: []
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublicFilters"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/public/contact-info:
    get:
      tags:
        - Công khai
      summary: Thông tin liên hệ
      description: Điện thoại và email lấy từ tài khoản chủ trọ (sửa ở Cài đặt), thiếu thì lấy của đơn vị. Không trả thông tin riêng tư khác.
      operationId: getPublicContactInfo
      x-actor: Khách vãng lai (không đăng nhập)
      security: []
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublicContactInfo"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/public/rooms:
    get:
      tags:
        - Công khai
      summary: Danh sách phòng
      description: Chỉ tin đăng đang công khai của phòng đang khai thác. Trạng thái tin đăng độc lập với tình trạng ở; availability cho biết còn trống/đang ở/đang giữ chỗ. Không trả thông tin khách.
      operationId: getPublicRooms
      x-actor: Khách vãng lai (không đăng nhập)
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Q"
        - name: amenities
          in: query
          required: false
          schema:
            type: string
        - name: priceMin
          in: query
          required: false
          schema:
            type: string
        - name: priceMax
          in: query
          required: false
          schema:
            type: string
        - name: province
          in: query
          required: false
          schema:
            type: string
        - name: locality
          in: query
          required: false
          schema:
            type: string
        - name: areaMin
          in: query
          required: false
          schema:
            type: string
        - name: roomType
          in: query
          required: false
          schema:
            type: string
        - name: occupants
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Trang kết quả (lọc/sắp xếp/phân trang trên toàn bộ tập ở máy chủ).
          content:
            "application/json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResult"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PublicRoomListItem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/public/rooms/{slug}:
    get:
      tags:
        - Công khai
      summary: Chi tiết phòng
      operationId: getPublicRoomsBySlug
      x-actor: Khách vãng lai (không đăng nhập)
      x-error-codes:
        - not_found
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublicRoom"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/properties:
    get:
      tags:
        - Cơ sở và phòng
      summary: Danh sách cơ sở
      operationId: getProperties
      x-actor: Nhân sự đơn vị (X-Organization-Id)
      x-permission: properties.read
      x-property-scope: Dữ liệu ngoài cơ sở được giao trả 404 (không lộ sự tồn tại).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Q"
        - name: isActive
          in: query
          required: false
          schema:
            type: string
