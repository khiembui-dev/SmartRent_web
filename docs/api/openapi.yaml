components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token ngắn hạn. Refresh token trong cookie HttpOnly gửi kèm POST /api/v1/auth/refresh (credentials: include, CORS cho phép origin frontend)."
  parameters:
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Đơn vị đang thao tác. Máy chủ kiểm tra người dùng là thành viên đang hoạt động của đơn vị này.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
      description: Khóa chống lặp do client tạo (UUID), giữ nguyên khi thử lại cùng thao tác. Lưu theo (người dùng, route, khóa) với hash nội dung.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: "Ví dụ: -createdAt hoặc dueOn,code. Chỉ nhận trường trong danh sách cho phép của từng API."
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Tìm kiếm không phân biệt hoa thường và dấu tiếng Việt (unaccent).
  responses:
    Unauthorized:
      description: Chưa đăng nhập hoặc access token hết hạn.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Không có quyền (forbidden) hoặc cấp quyền vượt quyền của mình (privilege_escalation).
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Không tồn tại hoặc nằm ngoài phạm vi được xem.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Xung đột: trạng thái đã đổi, trùng, chồng lịch (23P01), dữ liệu đang được dùng (23503), khóa kỳ."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Dữ liệu không hợp lệ (validation_failed, errors theo trường) hoặc vi phạm quy tắc nghiệp vụ (23514).
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Vượt giới hạn tần suất (API công khai, đăng nhập, quên mật khẩu). Kèm header Retry-After.
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Address:
      type: object
      required:
        - line
        - locality
        - province
        - latitude
        - longitude
      properties:
        line:
          type: string
        locality:
          type: string
        province:
          type: string
        latitude:
          type:
            - number
            - "null"
        longitude:
          type:
            - number
            - "null"
    AiConversation:
      type: object
      required:
        - id
        - organizationId
        - userId
        - title
        - createdAt
        - dataScope
        - messages
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        dataScope:
          type: object
          required:
            - properties
          properties:
            properties:
              type: string
            period:
              type: string
        messages:
          type: array
          items:
            type: object
            required:
              - id
              - conversationId
              - role
              - content
              - createdAt
              - sources
            properties:
              id:
                type: string
                format: uuid
              conversationId:
                type: string
                format: uuid
              role:
                type: string
              content:
                type: string
              createdAt:
                type: string
                format: date-time
              sources:
                type: array
                items:
                  type: string
              model:
                type: string
    AiConversationListItem:
      type: object
      required:
        - id
        - organizationId
        - userId
        - title
        - createdAt
        - dataScope
      properties:
        id:
          type: string
          format: uuid
        organizationId:
